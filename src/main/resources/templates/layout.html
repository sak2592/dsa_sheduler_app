<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">DSA Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script th:src="@{/timer.js}"></script>
    <style>
        .problem-card { transition: transform 0.2s; }
        .problem-card:hover { transform: translateY(-2px); }
        .difficulty-easy { border-left: 4px solid #28a745; }
        .difficulty-medium { border-left: 4px solid #ffc107; }
        .difficulty-hard { border-left: 4px solid #dc3545; }
        .status-completed { background-color: #d4edda; }
        .status-pending { background-color: #fff3cd; }
        .status-in-progress { background-color: #cce7ff; }
        .status-revisit { background-color: #f8d7da; }
        .overdue { background-color: #f8d7da !important; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/problems}">
            <i class="fas fa-code"></i> DSA Scheduler
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/problems}">All Problems</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/problems/new}">Add Problem</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/schedule/daily}">
                        <i class="fas fa-calendar-day"></i> Today's Schedule
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div layout:fragment="content">
        <!-- Content will be inserted here -->
    </div>
</div>

<footer class="bg-dark text-light mt-5 py-3">
    <div class="container text-center">
        <p>&copy; 2025 DSA Scheduler. Built by Selim Aktar Khan.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
